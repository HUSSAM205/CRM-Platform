# Reference deployment topology - NOT required for local development on this
# project (see docs/architecture.md: dev uses Neon Postgres + local-disk storage
# directly, no Docker needed). This is provided for:
#   - deploying somewhere Docker is available, or
#   - developers who'd rather self-host Postgres than use Neon.
#
# Run from the repo root:  docker compose -f infra/docker-compose.yml up --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://crm:crm@postgres:5432/crm
      JWT_SECRET: ${JWT_SECRET:?set a real secret in infra/.env}
      REFRESH_SECRET: ${REFRESH_SECRET:?set a real secret in infra/.env}
      CORS_ORIGINS: '["http://localhost:3000"]'
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/uploads
    volumes:
      - backend_uploads:/data/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_uploads:
